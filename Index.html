<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大耳狗 30 點雲朵集點卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(180deg, #dff3ff 0%, #f4fbff 55%, #ffffff 100%);
      color: #6b4c35;
      min-height: 100vh;
    }

    .cloud-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 2px solid #cbeaff;
      box-shadow: 0 12px 32px rgba(124, 198, 254, 0.22);
    }

    .stamp-slot {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
    }

    .stamp-slot:active {
      transform: scale(0.92);
    }

    @keyframes popIn {
      0% { transform: scale(0.4) rotate(-12deg); opacity: 0; }
      70% { transform: scale(1.12) rotate(4deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .stamp-pop {
      animation: popIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .float-slow {
      animation: floatSlow 2.6s ease-in-out infinite;
    }
  </style>
</head>
<body class="pb-14">
  <div class="max-w-xl mx-auto px-4 pt-6">
    <!-- 頂部標題列 -->
    <header class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-[#e3f4ff] border-2 border-[#89cff0] flex items-center justify-center text-2xl float-slow shadow-sm">
          ☁️
        </div>
        <div>
          <h1 id="cardTitleDisplay" class="text-xl font-black tracking-wide text-[#5a3e2b]">
            大耳狗 30 點集點卡
          </h1>
          <p class="text-xs text-[#8c6d56]">集滿 30 點即可解鎖專屬獎勵</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button
          onclick="openHistoryModal()"
          class="px-3 py-2 rounded-full bg-white border border-[#bce3fc] text-xs font-bold text-[#5a3e2b] hover:bg-[#eef8ff] transition shadow-sm"
        >
          紀錄
        </button>
        <button
          onclick="openSettingsModal()"
          class="w-10 h-10 rounded-full bg-white border border-[#bce3fc] flex items-center justify-center text-lg hover:bg-[#eef8ff] transition shadow-sm"
          title="設定"
        >
          ⚙️
        </button>
      </div>
    </header>

    <!-- 進度與飛行條 -->
    <section class="cloud-card rounded-3xl p-5 mb-5">
      <div class="flex items-baseline justify-between mb-2">
        <span class="text-sm font-bold text-[#7a5a43]">目前累積進度</span>
        <div class="text-right">
          <span id="pointsText" class="text-2xl font-black text-[#4aa8e8]">0</span>
          <span class="text-sm font-bold text-[#8c6d56]">/ 30 點</span>
        </div>
      </div>

      <div class="relative pt-6 pb-2">
        <div
          id="runnerAvatar"
          style="left: 0%;"
          class="absolute top-0 -translate-x-1/2 transition-all duration-500 ease-out flex flex-col items-center pointer-events-none"
        >
          <span class="text-2xl leading-none drop-shadow">🐶</span>
        </div>

        <div class="w-full h-4 rounded-full bg-[#e7f5ff] overflow-hidden border border-[#c7e8ff]">
          <div
            id="progressBar"
            style="width: 0%;"
            class="h-full rounded-full bg-gradient-to-r from-[#89cff0] via-[#6ec0f7] to-[#ffb6c1] transition-all duration-500 ease-out"
          ></div>
        </div>

        <div class="flex justify-between text-[11px] font-bold text-[#9a7d67] mt-1.5">
          <span>起點</span>
          <span id="remainingText">還差 30 點</span>
          <span>終點 🎁</span>
        </div>
      </div>

      <!-- 獎勵預覽條 -->
      <div class="mt-3 pt-3 border-t border-dashed border-[#d8effe] flex items-center justify-between gap-2">
        <div class="text-xs">
          <span class="text-[#8c6d56]">30 點獎勵：</span>
          <span id="rewardDisplay" class="font-bold text-[#5a3e2b]">專屬神秘大獎一份 🎁</span>
        </div>
        <button
          id="redeemBtn"
          onclick="openVoucherModal()"
          disabled
          class="px-4 py-1.5 rounded-full text-xs font-black transition bg-gray-200 text-gray-400 cursor-not-allowed"
        >
          尚未集滿
        </button>
      </div>
    </section>

    <!-- 30 格集點區 -->
    <section class="cloud-card rounded-3xl p-5 mb-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-black text-[#5a3e2b]">雲朵集點格（共 30 格）</h2>
        <span class="text-[11px] text-[#8c6d56]">點擊格數可快速調整</span>
      </div>

      <div id="stampGrid" class="grid grid-cols-5 sm:grid-cols-6 gap-2.5"></div>
    </section>

    <!-- 操作按鈕區 -->
    <section class="grid grid-cols-2 gap-3">
      <button
        onclick="handleUndoPoint()"
        class="py-3.5 px-4 rounded-2xl bg-white border-2 border-[#cbeaff] text-[#6b4c35] font-bold text-sm hover:bg-[#f2faff] transition shadow-sm"
      >
        ↩️ 收回 1 點
      </button>
      <button
        onclick="handleAddPoint()"
        class="py-3.5 px-4 rounded-2xl bg-gradient-to-r from-[#7cc6fe] to-[#5cb4f8] text-white font-black text-sm hover:brightness-105 transition shadow-md"
      >
        ✨ 蓋章 +1 點
      </button>
    </section>
  </div>

  <!-- 設定 Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 border-2 border-[#cbeaff] shadow-xl">
      <h3 class="text-lg font-black text-[#5a3e2b] mb-4">集點卡設定</h3>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block font-bold mb-1 text-[#7a5a43]">集點卡標題</label>
          <input id="inputTitle" type="text" class="w-full px-3.5 py-2 rounded-xl border border-[#cde8fc] focus:outline-none focus:border-[#6ec0f7]" />
        </div>

        <div>
          <label class="block font-bold mb-1 text-[#7a5a43]">30 點兌換獎勵</label>
          <input id="inputReward" type="text" class="w-full px-3.5 py-2 rounded-xl border border-[#cde8fc] focus:outline-none focus:border-[#6ec0f7]" />
        </div>

        <div>
          <label class="block font-bold mb-1 text-[#7a5a43]">操作密語（留空代表不設密碼）</label>
          <input id="inputPasscode" type="password" placeholder="例如：1234" class="w-full px-3.5 py-2 rounded-xl border border-[#cde8fc] focus:outline-none focus:border-[#6ec0f7]" />
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeModal('settingsModal')" class="px-4 py-2 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">取消</button>
        <button onclick="saveSettings()" class="px-5 py-2 rounded-xl bg-[#6ec0f7] text-white font-bold text-sm">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 兌換券 Modal -->
  <div id="voucherModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 border-2 border-[#ffb6c1] shadow-xl text-center">
      <div class="text-4xl mb-2">🎉</div>
      <h3 class="text-xl font-black text-[#5a3e2b] mb-1">集滿 30 點啦！</h3>
      <p class="text-xs text-[#8c6d56] mb-4">恭喜完成本輪大耳狗雲朵集點任務</p>

      <div class="bg-[#fff7f9] border-2 border-dashed border-[#ffb6c1] rounded-2xl p-4 mb-5">
        <div class="text-xs font-bold text-[#d9778a] mb-1">專屬兌換獎勵</div>
        <div id="voucherRewardText" class="text-lg font-black text-[#5a3e2b]">專屬神秘大獎一份 🎁</div>
      </div>

      <div class="flex gap-2">
        <button onclick="closeModal('voucherModal')" class="flex-1 py-2.5 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm">稍後再兌換</button>
        <button onclick="confirmRedeem()" class="flex-1 py-2.5 rounded-xl bg-[#ff8da1] text-white font-black text-sm">確認核銷並開新卡</button>
      </div>
    </div>
  </div>

  <!-- 紀錄 Modal -->
  <div id="historyModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 border-2 border-[#cbeaff] shadow-xl">
      <h3 class="text-lg font-black text-[#5a3e2b] mb-3">兌換紀錄</h3>
      <div id="historyList" class="max-h-60 overflow-y-auto space-y-2 text-sm mb-5"></div>
      <button onclick="closeModal('historyModal')" class="w-full py-2.5 rounded-xl bg-[#e7f5ff] text-[#4a8fc4] font-bold text-sm">關閉</button>
    </div>
  </div>

  <script>
    const MAX_POINTS = 30;
    const STORAGE_KEY = 'cinnamoroll_30_card_v1';

    let state = {
      title: '大耳狗 30 點集點卡',
      reward: '專屬神秘大獎一份 🎁',
      passcode: '',
      points: 0,
      history: []
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          state = { ...state, ...JSON.parse(raw) };
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function verifyPasscode() {
      if (!state.passcode) return true;
      const input = prompt('請輸入操作密語：');
      if (input === null) return false;
      if (input !== state.passcode) {
        alert('密語不正確喔！');
        return false;
      }
      return true;
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 90,
          spread: 75,
          origin: { y: 0.6 }
        });
      }
    }

    function setPoints(newPoints, animateIndex = null) {
      const clamped = Math.max(0, Math.min(MAX_POINTS, newPoints));
      const prev = state.points;
      state.points = clamped;
      saveState();
      render(animateIndex);

      if (prev < MAX_POINTS && clamped === MAX_POINTS) {
        triggerConfetti();
        setTimeout(() => openVoucherModal(), 450);
      }
    }

    function handleAddPoint() {
      if (!verifyPasscode()) return;
      if (state.points >= MAX_POINTS) {
        openVoucherModal();
        return;
      }
      const nextIdx = state.points;
      setPoints(state.points + 1, nextIdx);
    }

    function handleUndoPoint() {
      if (!verifyPasscode()) return;
      if (state.points <= 0) return;
      setPoints(state.points - 1);
    }

    function handleSlotClick(index) {
      if (!verifyPasscode()) return;
      const targetPoints = index + 1;
      if (state.points === targetPoints) {
        setPoints(index);
      } else {
        setPoints(targetPoints, index);
      }
    }

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function openSettingsModal() {
      document.getElementById('inputTitle').value = state.title;
      document.getElementById('inputReward').value = state.reward;
      document.getElementById('inputPasscode').value = state.passcode;
      openModal('settingsModal');
    }

    function saveSettings() {
      state.title = document.getElementById('inputTitle').value.trim() || '大耳狗 30 點集點卡';
      state.reward = document.getElementById('inputReward').value.trim() || '專屬神秘大獎一份 🎁';
      state.passcode = document.getElementById('inputPasscode').value.trim();
      saveState();
      render();
      closeModal('settingsModal');
    }

    function openVoucherModal() {
      if (state.points < MAX_POINTS) return;
      document.getElementById('voucherRewardText').textContent = state.reward;
      openModal('voucherModal');
    }

    function confirmRedeem() {
      const now = new Date().toLocaleString('zh-TW');
      state.history.unshift({
        reward: state.reward,
        time: now
      });
      state.points = 0;
      saveState();
      render();
      closeModal('voucherModal');
    }

    function openHistoryModal() {
      const container = document.getElementById('historyList');
      if (!state.history.length) {
        container.innerHTML = '<p class="text-center text-[#9a7d67] py-6">目前還沒有兌換紀錄喔</p>';
      } else {
        container.innerHTML = state.history
          .map(
            (item) => `
            <div class="p-3 rounded-2xl bg-[#f5fbff] border border-[#d6eeff] flex justify-between items-center">
              <span class="font-bold text-[#5a3e2b]">${item.reward}</span>
              <span class="text-xs text-[#8c6d56]">${item.time}</span>
            </div>
          `
          )
          .join('');
      }
      openModal('historyModal');
    }

    function render(animateIndex = null) {
      document.getElementById('cardTitleDisplay').textContent = state.title;
      document.getElementById('rewardDisplay').textContent = state.reward;
      document.getElementById('pointsText').textContent = state.points;

      const pct = Math.round((state.points / MAX_POINTS) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('runnerAvatar').style.left = `${pct}%`;

      const rem = MAX_POINTS - state.points;
      document.getElementById('remainingText').textContent =
        rem === 0 ? '已集滿 30 點！' : `還差 ${rem} 點`;

      const redeemBtn = document.getElementById('redeemBtn');
      if (state.points >= MAX_POINTS) {
        redeemBtn.disabled = false;
        redeemBtn.textContent = '立即兌換';
        redeemBtn.className =
          'px-4 py-1.5 rounded-full text-xs font-black transition bg-[#ff8da1] text-white shadow hover:brightness-105 cursor-pointer';
      } else {
        redeemBtn.disabled = true;
        redeemBtn.textContent = '尚未集滿';
        redeemBtn.className =
          'px-4 py-1.5 rounded-full text-xs font-bold transition bg-gray-200 text-gray-400 cursor-not-allowed';
      }

      const grid = document.getElementById('stampGrid');
      grid.innerHTML = '';

      for (let i = 0; i < MAX_POINTS; i++) {
        const stamped = i < state.points;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => handleSlotClick(i);

        if (stamped) {
          const popClass = animateIndex === i ? 'stamp-pop' : '';
          btn.className =
            'stamp-slot aspect-square rounded-2xl bg-[#e6f5ff] border-2 border-[#7cc6fe] flex flex-col items-center justify-center shadow-sm';
          btn.innerHTML = `
            <span class="text-xl leading-none ${popClass}">🐶</span>
            <span class="text-[10px] font-black text-[#4a8fc4] mt-0.5">${i + 1}</span>
          `;
        } else {
          btn.className =
            'stamp-slot aspect-square rounded-2xl bg-[#fafdff] border-2 border-dashed border-[#cce7fb] flex items-center justify-center text-xs font-bold text-[#a8c6dc] hover:border-[#89cff0]';
          btn.textContent = i + 1;
        }

        grid.appendChild(btn);
      }
    }

    loadState();
    render();
  </script>
</body>
</html>
